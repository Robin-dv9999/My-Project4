<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Hub | Robin</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Futuristik Google -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Latar Belakang Garis Grid Futuristik -->
    <div class="bg-grid"></div>

    <main class="card-container">
        <!-- Foto Profil dengan Ring Cahaya -->
        <div class="avatar-box">
            <img src="https://picsum.photos/300/300" alt="Cyber Avatar" class="avatar-img">
            <div class="online-badge"></div>
        </div>

        <!-- Identitas Utama -->
        <h1 class="glitch-text" data-text="ROBIN DV">ROBIN DV</h1>
        <p class="tagline">Mobile Developer & Programing Enthusiast</p>

        <!-- Baris Status Sistem -->
        <div class="status-bar">
            <div class="status-item">
                <span class="label">STATUS</span>
                <span class="value active">ONLINE</span>
            </div>
            <div class="status-item">
                <span class="label">PROJECTS</span>
                <span class="value">READY</span>
            </div>
        </div>

        <!-- Tombol Link Interaktif -->
        <div class="links-group">
            <a href="https://robin-dv9999.github.io/Website-Pertama/" class="cyber-btn" target="_blank">
                <span class="btn-text">🛠️ PANDUAN APA AJA</span>
                <span class="btn-glitch"></span>
            </a>

            <a href="#" class="cyber-btn" onclick="showPopup('Python & Web Application Development')">
                <span class="btn-text">💻 TECH STACK & SKILLS</span>
                <span class="btn-glitch"></span>
            </a>

            <a href="https://github.com/robin-dv9999" class="cyber-btn highlight" target="_blank">
                <span class="btn-text">🚀 GITHUB REPOSITORY</span>
                <span class="btn-glitch"></span>
            </a>
        </div>

        <!-- Footer Terminal -->
        <footer class="terminal-footer">
            <p>> System initialized... Ready for action.</p>
        </footer>
    </main>

    <script>
        function showPopup(text) {
            alert('SYSTEM INFO:\n' + text);
        }
    </script>
</body>
</html>
